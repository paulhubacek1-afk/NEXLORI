[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexlori"
version = "0.3.0"
description = "Nexlori – experimenteller Prototyp (eigener Rendering-Kern und Browser-Logik)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.1", "PySide6>=6.8,<7"]

[project.optional-dependencies]
gaming = ["psutil>=5.9"]
dev = ["pytest>=8"]

[project.scripts]
nexlori = "nexlori.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
