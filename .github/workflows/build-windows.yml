name: Windows-EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "NEXLORI/**"
      - ".github/workflows/build-windows.yml"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and test Nexlori plus Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    defaults:
      run:
        working-directory: NEXLORI
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Automatische Build-Version festlegen
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $match = Select-String -Path "pyproject.toml" -Pattern '^version = "([^"]+)"'
          if (-not $match) { throw "Programmversion aus pyproject.toml konnte nicht gelesen werden." }
          $version = $match.Matches[0].Groups[1].Value

          # Publish only intentional stable versions. Ordinary main builds still
          # produce CI artifacts but never create -build prereleases or overwrite a release.
          $publish = "true"
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF -eq "refs/heads/main") {
            $stableTag = "v" + $version
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
              "X-GitHub-Api-Version" = "2022-11-28"
            }
            try {
              $stableRelease = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$stableTag" -Headers $headers
              if ($stableRelease -and -not $stableRelease.draft) {
                $publish = "false"
                Write-Host "Stable release $stableTag already exists. This push will create CI artifacts only."
              }
            } catch {
              $status = 0
              try { $status = [int]$_.Exception.Response.StatusCode } catch {}
              if ($status -ne 404) { throw }
            }
          }

          $initPath = "src/nexlori/__init__.py"
          $source = Get-Content $initPath -Raw
          $source = [regex]::Replace($source, '__version__ = "[^"]+"', "__version__ = `"$version`"")
          [System.IO.File]::WriteAllText((Resolve-Path $initPath), $source, [System.Text.UTF8Encoding]::new($false))
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "publish=$publish" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Build version: $version; publish release: $publish"

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: NEXLORI/pyproject.toml

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gaming]" pyinstaller

      - name: Offizielles uBlock Origin Lite herunterladen und prüfen
        run: python packaging/download_extensions.py

      - name: Tests ausführen
        run: python -m pytest -q

      - name: App-Icon erzeugen
        run: python packaging/make_icon.py

      - name: Windows-EXE bauen
        run: python packaging/build_exe.py

      - name: Gebaute EXE starten und prüfen
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\Nexlori.exe"
          $out = Join-Path $PWD "selftest.txt"
          if (-not (Test-Path $exe)) {
            throw "Build-Ausgabe fehlt: $exe"
          }
          $process = Start-Process -FilePath $exe -ArgumentList @("--selftest", $out) -PassThru
          if (-not $process.WaitForExit(120000)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            throw "EXE-Selbsttest hängt länger als 120 Sekunden."
          }
          if (Test-Path $out) {
            Get-Content $out
          }
          if ($process.ExitCode -ne 0) {
            throw "EXE-Selbsttest fehlgeschlagen (Exit-Code $($process.ExitCode))"
          }
          if (-not (Test-Path $out)) {
            throw "Die EXE hat keine Selbsttest-Datei geschrieben."
          }

      - name: Browser-GUI initialisieren und prüfen
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\Nexlori.exe"
          $marker = Join-Path $PWD "gui-smoke-test.marker.txt"
          $stdout = Join-Path $PWD "gui-smoke-test.stdout.txt"
          $stderr = Join-Path $PWD "gui-smoke-test.stderr.txt"
          $progress = Join-Path $PWD "gui-smoke-test.progress.txt"
          Remove-Item $marker, $stdout, $stderr, $progress -Force -ErrorAction SilentlyContinue
          $env:NEXLORI_SMOKE_MARKER = $marker
          $env:NEXLORI_SMOKE_PROGRESS = $progress
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $deadline = (Get-Date).AddSeconds(35)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $marker)) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
            if ($process.HasExited) {
              $details = @()
              if (Test-Path $stdout) { $details += Get-Content $stdout -Raw }
              if (Test-Path $stderr) { $details += Get-Content $stderr -Raw }
              throw "Nexlori wurde vor dem Anzeigen des Browserfensters beendet. Exit-Code: $($process.ExitCode). $($details -join [Environment]::NewLine)"
            }
          }
          Remove-Item Env:NEXLORI_SMOKE_MARKER -ErrorAction SilentlyContinue
          Remove-Item Env:NEXLORI_SMOKE_PROGRESS -ErrorAction SilentlyContinue
          if (-not (Test-Path $marker)) {
            $progressDetails = if (Test-Path $progress) { Get-Content $progress -Raw } else { "kein Start-Checkpoint geschrieben" }
            $stderrDetails = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "keine stderr-Ausgabe" }
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            throw "Nexlori hat das GUI-Initialisieren nicht innerhalb von 35 Sekunden bestätigt. Letzter Start-Checkpoint: $progressDetails. stderr: $stderrDetails"
          }
          $details = Get-Content $marker -Raw
          Write-Host "GUI-Initialisierung erfolgreich: $details"
          if ($details -notmatch "shown=True" -or $details -notmatch "size=\d+x\d+") {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            throw "Nexlori hat kein sichtbares, korrekt dimensioniertes Browserfenster erstellt: $details"
          }
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) {
            throw "Nexlori hat sich kurz nach dem GUI-Start beendet (Exit-Code $($process.ExitCode))."
          }
          & taskkill.exe /PID $process.Id /T /F | Out-Null

      - name: SHA-256-Prüfsumme erzeugen
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\Nexlori.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Nexlori.exe" | Out-File -Encoding ascii "dist\Nexlori.exe.sha256"
          Get-Content "dist\Nexlori.exe.sha256"
          Copy-Item "src\nexlori\vendor\UBOL-LICENSE.txt" "dist\UBOL-LICENSE.txt"

      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y

      - name: Installationsprogramm mit Desktop-Shortcut bauen
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $programFiles = [Environment]::GetFolderPath('ProgramFiles')
          $compiler = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            $compiler = Join-Path $programFiles "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup Compiler wurde nicht gefunden."
          }
          & $compiler "/DMyAppVersion=$env:BUILD_VERSION" "packaging\Nexlori.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ist mit Code $LASTEXITCODE fehlgeschlagen." }
          if (-not (Test-Path "dist\Nexlori-Setup.exe")) { throw "Nexlori-Setup.exe wurde nicht erstellt." }

      - name: Artefaktgrößen ausgeben
        shell: pwsh
        run: |
          Get-Item "dist\Nexlori.exe", "dist\Nexlori-Setup.exe", "dist\Nexlori.exe.sha256" |
            Select-Object Name, Length

      - name: Portable EXE und Installer als Download speichern
        uses: actions/upload-artifact@v4
        with:
          name: Nexlori-Windows-x64
          path: |
            NEXLORI/dist/Nexlori.exe
            NEXLORI/dist/Nexlori.exe.sha256
            NEXLORI/dist/Nexlori-Setup.exe
            NEXLORI/dist/UBOL-LICENSE.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub-Release erstellen oder aktualisieren
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Repository für Versionsnummer auschecken
        uses: actions/checkout@v4

      - name: Build-Artefakt herunterladen
        uses: actions/download-artifact@v4
        with:
          name: Nexlori-Windows-x64
          path: dist

      - name: Release mit EXE, Installer und Prüfsumme anlegen oder aktualisieren
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub-hosted PowerShell treats non-zero native CLI exits as terminating
          # errors by default; release lookup must be allowed to return "not found".
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "v" + "${{ needs.build.outputs.version }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Stable release $tag already exists. Increase project version before publishing another release."
          }
          gh release create $tag dist\Nexlori.exe dist\Nexlori.exe.sha256 dist\Nexlori-Setup.exe dist\UBOL-LICENSE.txt --title "Nexlori $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "GitHub-Release konnte nicht erstellt werden." }

          # The updater requires the portable EXE and its checksum; never silently
          # publish an installer-only release that the in-app updater cannot use.
          $assetNames = gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -ne 0) { throw "Release-Assets konnten nicht überprüft werden." }
          foreach ($required in @("Nexlori.exe", "Nexlori.exe.sha256", "Nexlori-Setup.exe")) {
            if ($assetNames -notcontains $required) {
              throw "Release-Asset fehlt: $required. Der In-App-Updater benötigt Nexlori.exe und Nexlori.exe.sha256."
            }
          }
