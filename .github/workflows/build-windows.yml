name: Windows-EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "NEXLORI/**"
      - ".github/workflows/build-windows.yml"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and test Nexlori plus Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: NEXLORI
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Automatische Build-Version festlegen
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path "pyproject.toml" -Pattern '^version = "([^"]+)"'
          if (-not $match) { throw "Programmversion aus pyproject.toml konnte nicht gelesen werden." }
          $version = $match.Matches[0].Groups[1].Value
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:GITHUB_REF -eq "refs/heads/main") {
            $version = "$version-build.$env:GITHUB_RUN_NUMBER"
          } elseif ($env:GITHUB_REF.StartsWith("refs/tags/v")) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }
          $initPath = "src/nexlori/__init__.py"
          $source = Get-Content $initPath -Raw
          $source = [regex]::Replace($source, '__version__ = "[^"]+"', "__version__ = `"$version`"")
          [System.IO.File]::WriteAllText((Resolve-Path $initPath), $source, [System.Text.UTF8Encoding]::new($false))
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Build version: $version"

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: NEXLORI/pyproject.toml

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gaming]" pyinstaller

      - name: Tests ausführen
        run: python -m pytest -q

      - name: App-Icon erzeugen
        run: python packaging/make_icon.py

      - name: Windows-EXE bauen
        run: python packaging/build_exe.py

      - name: Gebaute EXE starten und prüfen
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist\Nexlori.exe"
          $out = Join-Path $PWD "selftest.txt"
          if (-not (Test-Path $exe)) {
            throw "Build-Ausgabe fehlt: $exe"
          }
          $process = Start-Process -FilePath $exe -ArgumentList @("--selftest", $out) -PassThru
          if (-not $process.WaitForExit(60000)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            throw "EXE-Selbsttest hängt länger als 60 Sekunden."
          }
          if (Test-Path $out) {
            Get-Content $out
          }
          if ($process.ExitCode -ne 0) {
            throw "EXE-Selbsttest fehlgeschlagen (Exit-Code $($process.ExitCode))"
          }
          if (-not (Test-Path $out)) {
            throw "Die EXE hat keine Selbsttest-Datei geschrieben."
          }

      - name: SHA-256-Prüfsumme erzeugen
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\Nexlori.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Nexlori.exe" | Out-File -Encoding ascii "dist\Nexlori.exe.sha256"
          Get-Content "dist\Nexlori.exe.sha256"

      - name: Inno Setup installieren
        run: choco install innosetup --no-progress -y

      - name: Installationsprogramm mit Desktop-Shortcut bauen
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $programFiles = [Environment]::GetFolderPath('ProgramFiles')
          $compiler = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            $compiler = Join-Path $programFiles "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup Compiler wurde nicht gefunden."
          }
          & $compiler "/DMyAppVersion=$env:BUILD_VERSION" "packaging\Nexlori.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup ist mit Code $LASTEXITCODE fehlgeschlagen." }
          if (-not (Test-Path "dist\Nexlori-Setup.exe")) { throw "Nexlori-Setup.exe wurde nicht erstellt." }

      - name: Artefaktgrößen ausgeben
        shell: pwsh
        run: |
          Get-Item "dist\Nexlori.exe", "dist\Nexlori-Setup.exe", "dist\Nexlori.exe.sha256" |
            Select-Object Name, Length

      - name: Portable EXE und Installer als Download speichern
        uses: actions/upload-artifact@v4
        with:
          name: Nexlori-Windows-x64
          path: |
            NEXLORI/dist/Nexlori.exe
            NEXLORI/dist/Nexlori.exe.sha256
            NEXLORI/dist/Nexlori-Setup.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub-Release erstellen oder aktualisieren
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Repository für Versionsnummer auschecken
        uses: actions/checkout@v4

      - name: Build-Artefakt herunterladen
        uses: actions/download-artifact@v4
        with:
          name: Nexlori-Windows-x64
          path: dist

      - name: Release mit EXE, Installer und Prüfsumme anlegen oder aktualisieren
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v" + "${{ needs.build.outputs.version }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist\Nexlori.exe dist\Nexlori.exe.sha256 dist\Nexlori-Setup.exe --clobber
          } else {
            gh release create $tag dist\Nexlori.exe dist\Nexlori.exe.sha256 dist\Nexlori-Setup.exe --title "Nexlori $tag" --generate-notes
          }
